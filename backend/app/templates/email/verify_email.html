<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; background: #f3f4f6; font-family: Manrope, system-ui, sans-serif; color: #111827">
    <table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px">
      <tr>
        <td style="padding: 28px">
          <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 800">Verify your email</h1>
          <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: #4b5563">
            Hi {{ name }}, welcome to Noolagam. Please confirm that this is your email address.
          </p>
          <a
            href="{{ verify_url }}"
            style="display: inline-block; padding: 14px 24px; border-radius: 12px; background: #0f766e; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none"
            >Verify my email</a
          >
          <p style="margin: 20px 0 0; font-size: 13px; line-height: 1.5; color: #4b5563">
            The link works once and expires in {{ expires_hours }} hours.
          </p>
          <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.5; color: #4b5563">
            If you didn't create this account, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
