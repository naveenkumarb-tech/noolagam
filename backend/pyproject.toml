[project]
name = "noolagam-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "bcrypt>=4.2",
    "celery[redis]>=5.4",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "gunicorn>=23",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30",
    "uvicorn-worker>=0.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

# Only the dependencies are installed; the code runs from /app.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.isort]
# Without this, the alembic/ migrations folder makes the installed package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "/tmp/.mypy_cache"
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider --cov=app --cov-report=term-missing:skip-covered"

[tool.coverage.run]
data_file = "/tmp/.coverage"
# SQLAlchemy's async layer runs on greenlets; without this, lines after an await are reported as missed.
concurrency = ["greenlet", "thread"]
